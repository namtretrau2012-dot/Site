<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENU FREE FIRE - ĐỖ QUỐC NAM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .menu {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            width: 400px;
            border-radius: 24px;
            padding: 24px 20px 30px;
            box-shadow: 0 20px 60px rgba(255, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid #2a2a4a;
        }
        .menu-header {
            text-align: center;
            border-bottom: 1px solid #2a2a4a;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .menu-header h1 {
            color: #ff4757;
            font-size: 26px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }
        .menu-header h1 small {
            font-size: 14px;
            color: #8892b0;
            display: block;
            margin-top: 4px;
            letter-spacing: 0;
        }
        .menu-header p {
            color: #8892b0;
            font-size: 12px;
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e1e32;
        }
        .social a {
            color: #8892b0;
            font-size: 13px;
            text-decoration: none;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .social a:hover { color: #ff4757; }
        .social .tiktok:hover { color: #00f2ea; }
        .social .fb:hover { color: #1877f2; }
        .music-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e1e32;
        }
        .music-control button {
            background: transparent;
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .music-control button:hover {
            background: #ff4757;
            color: #fff;
        }
        .music-control .vol {
            color: #8892b0;
            font-size: 12px;
        }
        .music-control input[type="range"] {
            width: 80px;
            background: #0d0d1a;
            border: none;
            accent-color: #ff4757;
        }
        .toggle-main {
            background: #ff4757;
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 10px;
            border-radius: 30px;
            width: 100%;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
        }
        .toggle-main:hover { background: #ff6b81; }
        .toggle-main.off { background: #2d3436; box-shadow: none; }

        .section {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 16px 14px;
            margin-bottom: 14px;
            border-left: 3px solid #ff4757;
        }
        .section-title {
            color: #ccd6f6;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title span { color: #ff4757; }
        .btn-func {
            background: transparent;
            border: 2px solid #ff4757;
            color: #ff4757;
            padding: 12px;
            border-radius: 30px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .btn-func:hover { background: #ff4757; color: #fff; }
        .btn-func.active { background: #ff4757; color: #fff; box-shadow: 0 0 30px rgba(255,71,87,0.4); }
        .btn-func.sub { border-color: #2ecc71; color: #2ecc71; }
        .btn-func.sub:hover { background: #2ecc71; color: #fff; }
        .btn-func.sub.active { background: #2ecc71; color: #fff; box-shadow: 0 0 30px rgba(46,204,113,0.4); }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            margin-bottom: 8px;
            align-items: center;
            justify-content: center;
        }
        .row label {
            color: #a8b2d1;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff4757;
            cursor: pointer;
        }
        .row input[type="range"] {
            background: #0d0d1a;
            border: 1px solid #2a2a4a;
            color: #fff;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            width: 100px;
        }
        .row .value {
            color: #ff4757;
            font-size: 12px;
            min-width: 30px;
            text-align: right;
        }
        .status-bar {
            text-align: center;
            color: #8892b0;
            font-size: 13px;
            padding: 8px;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            margin-top: 10px;
        }
        .status-bar .highlight { color: #ff4757; font-weight: bold; }
        .btn-apply {
            background: transparent;
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 8px;
            border-radius: 30px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-apply:hover { background: #ff4757; color: #fff; }
        .note {
            color: #495670;
            font-size: 10px;
            text-align: center;
            margin-top: 14px;
            border-top: 1px solid #1e1e32;
            padding-top: 14px;
        }
        audio { display: none; }
    </style>
</head>
<body>
<div class="menu" id="menuContainer">
    <div class="menu-header">
        <h1>⚡ ĐỖ QUỐC NAM <small>MENU</small></h1>
        <p>FREE FIRE · AIM + ĐỊNH VỊ</p>
        <div class="social">
            <a href="https://www.tiktok.com/@sothikhoichoi" target="_blank" class="tiktok">🎵 @sothikhoichoi</a>
            <a href="https://www.facebook.com/QuocNam" target="_blank" class="fb">📘 Quoc Nam</a>
        </div>
        <div class="music-control">
            <button id="playBtn">▶ PLAY</button>
            <span class="vol">🔊</span>
            <input type="range" id="volControl" min="0" max="1" step="0.1" value="0.5">
            <span class="vol" id="volLabel">50%</span>
        </div>
    </div>

    <button class="toggle-main" id="mainToggle">▶ KÍCH HOẠT</button>

    <!-- CHỨC NĂNG 1: AIMBOT -->
    <div class="section">
        <div class="section-title">🎯 CHỨC NĂNG 1 <span>AIMBOT</span></div>
        <button class="btn-func" id="funcAim">▶ BẬT AIMBOT</button>
        <div class="row">
            <label><input type="checkbox" id="aimHeadshot" checked> Ưu tiên cổ</label>
            <label><input type="checkbox" id="aimAutoFire"> Tự động bắn</label>
        </div>
        <div class="row">
            <label>Tốc độ: <input type="range" id="aimSpeed" min="0.2" max="1.0" step="0.05" value="0.75"></label>
            <span class="value" id="aimSpeedVal">0.75</span>
        </div>
    </div>

    <!-- CHỨC NĂNG 2: ĐỊNH VỊ -->
    <div class="section" style="border-left-color: #2ecc71;">
        <div class="section-title">📍 CHỨC NĂNG 2 <span style="color:#2ecc71;">ĐỊNH VỊ</span></div>
        <button class="btn-func sub" id="funcLocate">▶ BẬT ĐỊNH VỊ</button>
        <div class="row">
            <label><input type="checkbox" id="locateBox" checked> Khung</label>
            <label><input type="checkbox" id="locateName" checked> Tên</label>
            <label><input type="checkbox" id="locateDist" checked> Khoảng cách</label>
        </div>
        <div class="row">
            <label>Màu địch: <input type="color" id="enemyColor" value="#ff0000" style="width:40px;"></label>
            <label>Màu đồng đội: <input type="color" id="teamColor" value="#00ff00" style="width:40px;"></label>
        </div>
    </div>

    <!-- TRẠNG THÁI -->
    <div class="status-bar" id="statusBar">
        🟢 Trạng thái: <span class="highlight" id="statusText">SẴN SÀNG</span>
    </div>

    <button class="btn-apply" id="applyBtn">✅ ÁP DỤNG CẤU HÌNH</button>
    <div class="note">Bản quyền thuộc về Đỗ Quốc Nam · Dành cho mục đích nghiên cứu</div>
</div>

<!-- Audio: Nhạc Remix (Nguồn từ bên thứ ba, có thể thay link) -->
<audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
    // ===== MUSIC =====
    const audio = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');
    const volControl = document.getElementById('volControl');
    const volLabel = document.getElementById('volLabel');
    let isPlaying = false;

    // Phát / Tạm dừng
    playBtn.addEventListener('click', function() {
        if (isPlaying) {
            audio.pause();
            this.textContent = '▶ PLAY';
        } else {
            audio.play().catch(() => {
                alert('⚠️ Không thể phát nhạc. Kiểm tra kết nối mạng.');
            });
            this.textContent = '⏸ PAUSE';
        }
        isPlaying = !isPlaying;
    });

    // Điều chỉnh âm lượng
    volControl.addEventListener('input', function() {
        audio.volume = this.value;
        volLabel.textContent = Math.round(this.value * 100) + '%';
    });

    // Tự động phát khi người dùng tương tác (tránh lỗi iOS)
    document.addEventListener('click', function() {
        if (!isPlaying && audio.paused) {
            // Không tự động play, để người dùng bấm PLAY
        }
    });

    // Nếu nhạc kết thúc, tự động lặp (đã có loop)
    audio.addEventListener('ended', function() {
        // Loop đã được bật, không cần xử lý thêm
    });

    // ===== HIỂN THỊ GIÁ TRỊ SLIDER =====
    document.getElementById('aimSpeed').addEventListener('input', function() {
        document.getElementById('aimSpeedVal').textContent = this.value;
    });

    // NÚT KÍCH HOẠT CHÍNH
    let mainOn = true;
    document.getElementById('mainToggle').addEventListener('click', function() {
        mainOn = !mainOn;
        this.textContent = mainOn ? '▶ KÍCH HOẠT' : '⏸ TẠM DỪNG';
        this.classList.toggle('off', !mainOn);
        updateStatus();
    });

    // CHỨC NĂNG 1: AIMBOT
    let aimOn = false;
    document.getElementById('funcAim').addEventListener('click', function() {
        if (!mainOn) { alert('⚠️ Vui lòng bật KÍCH HOẠT chính trước!'); return; }
        aimOn = !aimOn;
        this.textContent = aimOn ? '⏸ TẮT AIMBOT' : '▶ BẬT AIMBOT';
        this.classList.toggle('active', aimOn);
        updateStatus();
    });

    // CHỨC NĂNG 2: ĐỊNH VỊ
    let locateOn = false;
    document.getElementById('funcLocate').addEventListener('click', function() {
        if (!mainOn) { alert('⚠️ Vui lòng bật KÍCH HOẠT chính trước!'); return; }
        locateOn = !locateOn;
        this.textContent = locateOn ? '⏸ TẮT ĐỊNH VỊ' : '▶ BẬT ĐỊNH VỊ';
        this.classList.toggle('active', locateOn);
        updateStatus();
    });

    // CẬP NHẬT TRẠNG THÁI
    function updateStatus() {
        const status = document.getElementById('statusText');
        if (!mainOn) {
            status.textContent = '🔴 TẠM DỪNG';
            status.style.color = '#ff4757';
        } else if (aimOn && locateOn) {
            status.textContent = '✅ AIMBOT + ĐỊNH VỊ ĐANG BẬT';
            status.style.color = '#2ecc71';
        } else if (aimOn) {
            status.textContent = '✅ AIMBOT ĐANG BẬT';
            status.style.color = '#ff4757';
        } else if (locateOn) {
            status.textContent = '✅ ĐỊNH VỊ ĐANG BẬT';
            status.style.color = '#2ecc71';
        } else {
            status.textContent = '🟢 SẴN SÀNG';
            status.style.color = '#ff4757';
        }
    }

    // NÚT ÁP DỤNG
    document.getElementById('applyBtn').addEventListener('click', function() {
        const config = {
            creator: "Đỗ Quốc Nam",
            tiktok: "@sothikhoichoi",
            facebook: "Quoc Nam",
            music: {
                playing: isPlaying,
                volume: parseFloat(volControl.value)
            },
            main: mainOn,
            aim: {
                enable: aimOn,
                headshot: document.getElementById('aimHeadshot').checked,
                autoFire: document.getElementById('aimAutoFire').checked,
                speed: parseFloat(document.getElementById('aimSpeed').value)
            },
            locate: {
                enable: locateOn,
                box: document.getElementById('locateBox').checked,
                name: document.getElementById('locateName').checked,
                dist: document.getElementById('locateDist').checked,
                enemyColor: document.getElementById('enemyColor').value,
                teamColor: document.getElementById('teamColor').value
            }
        };
        console.log('===== ĐỖ QUỐC NAM CONFIG =====');
        console.log(JSON.stringify(config, null, 2));
        alert('✅ Đã áp dụng cấu hình!\nAimbot: ' + (aimOn ? 'BẬT' : 'TẮT') + '\nĐịnh vị: ' + (locateOn ? 'BẬT' : 'TẮT'));
    });

    // KHỞI TẠO
    updateStatus();
</script>
</body>
</html>
